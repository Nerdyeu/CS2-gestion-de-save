name: Build Windows EXE

# Construit automatiquement CitySync.exe sur une machine Windows GitHub,
# le publie comme Release telechargeable (tag "app-latest") ET comme artifact.
on:
  push:
    branches: ["main", "master", "claude/**"]
    paths-ignore:
      - "**.md"
      - "tests/**"
  workflow_dispatch: {}

# Necessaire pour creer/mettre a jour une Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.1.0

      - name: Construire l'executable
        run: python build_exe.py

      - name: Publier l'executable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CitySync-windows
          path: dist/CitySync.exe
          if-no-files-found: error

      - name: Publier en Release telechargeable (app-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Telecharge CitySync.exe ci-dessous et double-clique dessus. Aucun Python a installer."
          if gh release view app-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload app-latest dist/CitySync.exe -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create app-latest dist/CitySync.exe -R "$GITHUB_REPOSITORY" \
              --title "CitySync (derniere version)" --notes "$NOTES"
          fi
